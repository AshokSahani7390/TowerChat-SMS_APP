<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Packet Not Found | Towerchat Live Bridge</title>
    <meta name="description" content="The requested Towerchat resource or carrier endpoint could not be routed across the local bridge.">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #030712;
            --bg-surface: #0B132B;
            --bg-surface-elevated: #111E3D;
            --border-subtle: rgba(148, 163, 184, 0.16);
            --border-glow: rgba(0, 242, 254, 0.4);
            --text-primary: #FFFFFF;
            --text-secondary: #94A3B8;
            --text-tertiary: #64748B;
            --brand-primary: #00F2FE;
            --brand-gradient: linear-gradient(135deg, #00F2FE 0%, #4FACFE 100%);
            --font-display: 'Plus Jakarta Sans', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-display);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 24px;
        }

        .error-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 24px;
            padding: 48px 36px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 242, 254, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .badge-404 {
            font-family: var(--font-mono);
            font-size: 64px;
            font-weight: 800;
            background: var(--brand-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
        }

        .signal-icon {
            font-size: 40px;
            animation: pulse-signal 2s infinite ease-in-out;
        }

        @keyframes pulse-signal {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 1; }
        }

        h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        p {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.5;
            max-width: 400px;
        }

        .btn-home {
            margin-top: 12px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            border-radius: 12px;
            background: var(--brand-gradient);
            color: #020817;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
        }

        .btn-home:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 6px 25px rgba(0, 242, 254, 0.5);
        }

        footer {
            margin-top: 32px;
            font-size: 12px;
            color: var(--text-tertiary);
            text-align: center;
        }

        footer a {
            color: var(--brand-primary);
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="signal-icon">📡</div>
        <div class="badge-404">404</div>
        <h1>Carrier Signal Not Found</h1>
        <p>The requested endpoint or asset does not exist on this cellular tower bridge node. Your device may be out of range or the route was moved.</p>
        <a href="/" class="btn-home">
            <span>←</span> Return to Live Bridge
        </a>
    </div>

    <footer>
        <p>© <span id="year">2026</span> Towerchat. Carrier-Native Zero-Server Architecture. <a href="/">Status: Online</a></p>
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
