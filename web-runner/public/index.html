<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Favicon Links -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="alternate icon" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/favicon.svg">

    <!-- Page Title & Meta Description -->
    <title>Towerchat — Carrier-Native E2EE Messaging</title>
    <meta name="description" content="Offline carrier-native zero-server end-to-end encrypted messaging across cellular SMS signaling towers with zero-disk volatile RAM architecture.">
    <meta name="keywords" content="SMS, E2EE, Offline Messenger, Zero Disk, RAM Only, Curve25519, AES-256-GCM, Carrier Native">
    <meta property="og:title" content="Towerchat — Pure App UI">
    <meta property="og:description" content="Zero-Internet, Zero-Disk, Volatile RAM Cellular SMS Messenger.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="/favicon.svg">
    <meta name="twitter:card" content="summary">
    <meta name="theme-color" content="#030712">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Dark Theme Tokens */
            --bg-base: #030712;
            --bg-surface: #0B132B;
            --bg-surface-elevated: #111E3D;
            --bg-surface-glass: rgba(11, 19, 43, 0.85);
            --bg-surface-subtle: rgba(255, 255, 255, 0.05);

            --border-subtle: rgba(148, 163, 184, 0.16);
            --border-highlight: rgba(0, 242, 254, 0.35);
            --border-glow: rgba(0, 242, 254, 0.6);

            --text-primary: #FFFFFF;
            --text-secondary: #94A3B8;
            --text-tertiary: #64748B;
            --text-inverse: #020817;

            --brand-primary: #00F2FE;
            --brand-secondary: #4FACFE;
            --brand-gradient: linear-gradient(135deg, #00F2FE 0%, #4FACFE 100%);
            --brand-gradient-hover: linear-gradient(135deg, #38F9D7 0%, #4FACFE 100%);

            --status-success: #10B981;
            --status-danger: #EF4444;

            --space-4: 4px;
            --space-8: 8px;
            --space-12: 12px;
            --space-16: 16px;
            --space-20: 20px;
            --space-24: 24px;

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 18px;
            --radius-full: 9999px;

            --shadow-subtle: 0 4px 20px rgba(0, 0, 0, 0.35);
            --shadow-glow: 0 0 30px rgba(0, 242, 254, 0.25);

            --spring-physics: all 0.26s cubic-bezier(0.16, 1, 0.3, 1);
            --fast-ease: all 0.15s ease-out;

            --font-display: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        [data-theme="light"] {
            --bg-base: #F8FAFC;
            --bg-surface: #FFFFFF;
            --bg-surface-elevated: #F1F5F9;
            --bg-surface-glass: rgba(255, 255, 255, 0.92);
            --bg-surface-subtle: rgba(0, 0, 0, 0.04);

            --border-subtle: rgba(148, 163, 184, 0.26);
            --border-highlight: rgba(0, 150, 214, 0.45);
            --border-glow: rgba(0, 150, 214, 0.35);

            --text-primary: #0F172A;
            --text-secondary: #475569;
            --text-tertiary: #94A3B8;
            --text-inverse: #FFFFFF;

            --brand-gradient: linear-gradient(135deg, #0284C7 0%, #0369A1 100%);
            --shadow-subtle: 0 4px 20px rgba(0, 0, 0, 0.08);
            --shadow-glow: 0 0 25px rgba(2, 132, 199, 0.2);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: var(--font-display);
            background: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* Skip link for accessibility */
        .skip-to-main {
            position: fixed;
            top: -100px;
            left: 20px;
            background: var(--brand-primary);
            color: var(--text-inverse);
            padding: 10px 18px;
            font-weight: 700;
            font-size: 13px;
            border-radius: var(--radius-md);
            z-index: 10000;
            transition: top 0.2s ease;
            text-decoration: none;
            box-shadow: var(--shadow-glow);
        }
        .skip-to-main:focus {
            top: 16px;
        }

        /* Minimal Header */
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--bg-surface-glass);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--border-subtle);
            padding: var(--space-12) var(--space-24);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-16);
            height: 64px;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: var(--space-12);
            text-decoration: none;
            color: inherit;
        }

        .brand-badge-icon {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-md);
            background: var(--bg-surface-elevated);
            border: 1px solid var(--border-highlight);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: var(--shadow-glow);
        }

        .brand-title-wrap h1 {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: var(--space-8);
        }

        .tech-pill {
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 2px 7px;
            border-radius: var(--radius-full);
            background: var(--bg-surface-subtle);
            border: 1px solid var(--border-subtle);
            color: var(--brand-primary);
        }

        /* Cellular Status Badge */
        .live-status-badge {
            display: flex;
            align-items: center;
            gap: var(--space-8);
            font-size: 12px;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: var(--radius-full);
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.35);
            color: var(--status-success);
        }

        .status-dot-pulse {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--status-success);
            box-shadow: 0 0 10px var(--status-success);
            animation: pulse-dot 1.8s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.5; }
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: var(--space-12);
        }

        .btn-icon {
            width: 36px;
            height: 36px;
            padding: 0;
            border-radius: var(--radius-md);
            background: var(--bg-surface-subtle);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--fast-ease);
        }
        .btn-icon:hover {
            border-color: var(--border-highlight);
            color: var(--brand-primary);
            background: var(--bg-surface-elevated);
            transform: scale(1.04);
        }

        /* Centered Pure App UI Viewport */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-16);
            width: 100%;
            box-sizing: border-box;
        }

        .simulator-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 420px;
        }

        /* Realistic Phone Mockup Frame */
        .phone-mockup-frame {
            background: #000000;
            border: 3.5px solid rgba(255, 255, 255, 0.14);
            border-radius: 46px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75), 0 0 45px rgba(0, 242, 254, 0.22);
            padding: 10px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 380px;
            transition: var(--spring-physics);
        }

        .phone-mockup-frame:hover {
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.85), 0 0 55px rgba(0, 242, 254, 0.32);
        }

        /* Phone Camera Notch */
        .phone-notch {
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            width: 90px;
            height: 20px;
            background: #111111;
            border-radius: 20px;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .notch-camera {
            width: 8px;
            height: 8px;
            background: #050d1a;
            border-radius: 50%;
            border: 1px solid #1a2c42;
        }

        /* Interactive Screen Canvas */
        .screen-viewport {
            width: 100%;
            height: min(720px, calc(100vh - 160px));
            aspect-ratio: 9 / 19.5;
            background: #020817;
            border-radius: 36px;
            overflow: hidden;
            position: relative;
            cursor: crosshair;
        }

        #screen-img {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* Shimmer Skeleton Loader */
        .skeleton-loader {
            position: absolute;
            inset: 0;
            background: var(--bg-surface);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: var(--space-16);
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        .shimmer-element {
            background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.12) 50%, rgba(255,255,255,0.03) 75%);
            background-size: 200% 100%;
            animation: shimmer-swipe 1.6s infinite;
            border-radius: var(--radius-sm);
        }

        @keyframes shimmer-swipe {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .tap-click-ripple {
            position: absolute;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgba(0, 242, 254, 0.4);
            border: 2px solid var(--brand-primary);
            transform: translate(-50%, -50%) scale(0);
            pointer-events: none;
            opacity: 0;
            z-index: 50;
            transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1), opacity 0.3s ease;
        }

        .tap-click-ripple.animate {
            transform: translate(-50%, -50%) scale(1.6);
            opacity: 1;
        }

        /* Android Soft Navigation Bar */
        .phone-soft-nav {
            display: flex;
            align-items: center;
            justify-content: space-around;
            width: 100%;
            padding: var(--space-8) 0 4px 0;
            background: transparent;
        }

        .nav-key-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 15px;
            font-weight: 600;
            padding: 6px 20px;
            cursor: pointer;
            border-radius: var(--radius-sm);
            transition: var(--fast-ease);
        }
        .nav-key-btn:hover {
            color: var(--brand-primary);
            background: var(--bg-surface-subtle);
        }
        .nav-key-btn:active {
            transform: scale(0.92);
        }

        /* Toast Notification System */
        #toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: var(--space-8);
            z-index: 9999;
            pointer-events: none;
        }

        .toast {
            pointer-events: auto;
            background: var(--bg-surface-glass);
            border: 1px solid var(--border-highlight);
            backdrop-filter: blur(16px);
            border-radius: var(--radius-md);
            padding: 10px 16px;
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: var(--space-8);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            transform: translateX(120%);
            opacity: 0;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
        }

        .toast.show {
            transform: translateX(0);
            opacity: 1;
        }

        @media (max-width: 480px) {
            header {
                padding: var(--space-8) var(--space-12);
                height: 56px;
            }
            .phone-mockup-frame {
                border-radius: 32px;
                padding: 6px;
                max-width: 100%;
            }
            .screen-viewport {
                border-radius: 26px;
                height: calc(100vh - 120px);
            }
        }
    </style>
</head>
<body>
    <a href="#main-content" class="skip-to-main">Skip to main content</a>

    <!-- Minimal Header -->
    <header>
        <a href="/" class="header-brand" title="Towerchat Home">
            <div class="brand-badge-icon">📡</div>
            <div class="brand-title-wrap">
                <h1>Towerchat <span class="tech-pill">E2EE v1.1</span></h1>
            </div>
        </a>

        <div class="live-status-badge">
            <span class="status-dot-pulse"></span>
            <span>Cellular Active</span>
        </div>

        <div class="header-actions">
            <!-- Dark / Light Mode Toggle -->
            <button class="btn-icon" id="theme-toggle" onclick="toggleTheme()" aria-label="Toggle Theme" title="Toggle Light/Dark Theme">
                <span id="theme-icon">☀️</span>
            </button>
        </div>
    </header>

    <!-- Centered Pure App UI Viewport -->
    <main id="main-content">
        <section class="simulator-stage" aria-label="Phone Emulator Display">
            <div class="phone-mockup-frame">
                <div class="phone-notch">
                    <div class="notch-camera"></div>
                </div>

                <div class="screen-viewport" id="screen-container" title="Click anywhere to tap the screen">
                    <!-- Shimmer Skeleton Loader -->
                    <div class="skeleton-loader" id="phone-skeleton">
                        <div class="shimmer-element" style="width: 180px; height: 28px;"></div>
                        <div class="shimmer-element" style="width: 240px; height: 16px;"></div>
                        <div class="shimmer-element" style="width: 120px; height: 120px; border-radius: 50%;"></div>
                        <div class="shimmer-element" style="width: 220px; height: 38px; border-radius: 20px;"></div>
                    </div>

                    <img id="screen-img" src="/api/screen" alt="Towerchat Live Android Display">
                    <div class="tap-click-ripple" id="tap-indicator"></div>
                </div>

                <!-- Android System Soft Keys -->
                <div class="phone-soft-nav" role="toolbar" aria-label="Android System Soft Keys">
                    <button class="nav-key-btn" onclick="sendKey(4)" title="Back Key (KeyCode 4)">◀ Back</button>
                    <button class="nav-key-btn" onclick="sendKey(3)" title="Home Key (KeyCode 3)">● Home</button>
                    <button class="nav-key-btn" onclick="sendKey(187)" title="Recents (KeyCode 187)">■ Apps</button>
                </div>
            </div>
        </section>
    </main>

    <!-- Toast Notification Container -->
    <div id="toast-container" aria-live="polite"></div>

    <script>
        // Theme Switcher with LocalStorage Persistence
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('towerchat_theme', theme);
            const icon = document.getElementById('theme-icon');
            if (icon) icon.textContent = theme === 'dark' ? '☀️' : '🌙';
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme') || 'dark';
            const next = current === 'dark' ? 'light' : 'dark';
            setTheme(next);
            showToast(`Theme: ${next.toUpperCase()}`, '🌓');
        }

        const savedTheme = localStorage.getItem('towerchat_theme') || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        setTheme(savedTheme);

        // Toast Notification System
        function showToast(message, icon = 'ℹ️') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<span style="font-size: 16px;">${icon}</span><span>${message}</span>`;
            container.appendChild(toast);

            requestAnimationFrame(() => toast.classList.add('show'));
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        // Live Screen Capture Stream
        const screenImg = document.getElementById('screen-img');
        const screenContainer = document.getElementById('screen-container');
        const tapIndicator = document.getElementById('tap-indicator');
        const phoneSkeleton = document.getElementById('phone-skeleton');

        function updateScreen() {
            const tempImg = new Image();
            tempImg.src = '/api/screen?t=' + Date.now();
            tempImg.onload = () => {
                screenImg.src = tempImg.src;
                if (phoneSkeleton) phoneSkeleton.style.opacity = '0';
            };
        }
        setInterval(updateScreen, 450);

        // Interactive Touch Coordinate Mapping
        screenContainer.addEventListener('click', (e) => {
            const rect = screenContainer.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width;
            const y = (e.clientY - rect.top) / rect.height;

            tapIndicator.style.left = (e.clientX - rect.left) + 'px';
            tapIndicator.style.top = (e.clientY - rect.top) + 'px';
            tapIndicator.classList.remove('animate');
            void tapIndicator.offsetWidth;
            tapIndicator.classList.add('animate');

            fetch('/api/tap', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ x, y })
            }).then(() => setTimeout(updateScreen, 200));
        });

        // Android System Soft Key Sender
        function sendKey(code) {
            fetch('/api/key', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code })
            }).then(() => {
                setTimeout(updateScreen, 250);
            });
        }
    </script>
</body>
</html>
