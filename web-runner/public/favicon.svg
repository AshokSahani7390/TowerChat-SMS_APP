<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tc-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>
    <linearGradient id="tc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>
  </defs>
  <!-- Background Disc -->
  <rect width="64" height="64" rx="16" fill="url(#tc-bg)"/>
  <rect width="60" height="60" x="2" y="2" rx="14" fill="none" stroke="url(#tc-grad)" stroke-width="1.5" stroke-opacity="0.3"/>
  
  <!-- Signal Tower / Dish Antenna Icon -->
  <g transform="translate(12, 12)">
    <!-- Base Mount -->
    <path d="M14 36 L26 36 M20 36 L20 26" stroke="url(#tc-grad)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Dish Parabolic Arc -->
    <path d="M8 12 Q20 28 32 16" fill="none" stroke="url(#tc-grad)" stroke-width="3" stroke-linecap="round"/>
    <!-- Feed Horn -->
    <line x1="20" y1="21" x2="28" y2="8" stroke="#38F9D7" stroke-width="2" stroke-linecap="round"/>
    <circle cx="28" cy="8" r="2.5" fill="#00F2FE"/>
    <!-- Broadcast Waves -->
    <path d="M30 4 A 6 6 0 0 1 36 10" fill="none" stroke="#38F9D7" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M33 1 A 10 10 0 0 1 40 8" fill="none" stroke="#00F2FE" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</svg>
